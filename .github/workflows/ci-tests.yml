name: CI Tests & Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test & Build Pipeline
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: 3. Install Root (Frontend) Dependencies
        run: npm ci

      - name: 4. Install Server (Backend) Dependencies
        working-directory: server
        run: npm ci

      - name: 5. Run Frontend Automated Tests (Vitest)
        run: npm test

      - name: 6. Run Backend Automated Tests
        working-directory: server
        run: npm test

      - name: 7. Run Production Build (TypeScript & Vite)
        run: npm run build
